name: Build Gen 3 mod index and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Synchronize Gen 3 mods
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOD_SOURCE_REPO: FAFF0x/gen3recomp
          MOD_SOURCE_REF: main
          MOD_INDEX_AUTHOR: FAFF0x
        run: node scripts/sync-index.mjs

      - name: Commit synchronized mod entries
        run: |
          changes=$(git status --porcelain -- mods)
          if [ -z "$changes" ]; then
            echo "No mod entry changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mods
            git commit -m "Sync Gen 3 mod entries [skip ci]"
            git push
          fi

      - name: Show indexed mods
        run: node -e "const i=require('./site/data/index.json'); console.log(i.count+' mod(s) indexed')"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
